name: 'package_health'
version: '1.0.0'
profile: 'package_health'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Shared values used by the models
vars:
  window_start: '2024-01-01'

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  package_health:
    # Staging models are thin cleanups of the raw tables, so views (always current, no storage)
    staging:
      +materialized: view
    # Marts are read repeatedly by Tasks 4-6, so build them once as tables
    marts:
      +materialized: table
