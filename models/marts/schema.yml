version: 2

# "Run time" = max(fetched_at) across the raw tables (macros/run_time.sql), so rebuilds without new data match.
# Open PRs are kept and flagged is_open; their merge/close durations stay NULL instead of getting a fake end date,
# so medians of hours_to_merge / hours_to_close only cover PRs that actually merged / closed.

models:
  - name: fct_pull_requests
    description: "One row per PR created on or after the window start (2024-01-01), with review timing, outcome flags, and durations. Includes bot PRs (flagged is_bot); the marts exclude them."
    columns:
      - name: repo
        description: "Repository as owner/name."
      - name: number
        description: "PR number."
      - name: pr_key
        description: "Primary key: repo || '#' || number."
        data_tests:
          - unique
          - not_null
      - name: author_login
        description: "GitHub login of the PR author."
      - name: is_bot
        description: "True if the PR author is a bot (see the bot rule in staging/schema.yml)."
      - name: state
        description: "open or closed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: "When the PR was opened, UTC."
      - name: updated_at
        description: "Last activity on the PR, UTC."
      - name: closed_at
        description: "When the PR was closed, UTC; NULL while open."
      - name: merged_at
        description: "When the PR was merged, UTC; NULL unless merged."
      - name: is_merged
        description: "merged_at IS NOT NULL."
      - name: is_closed_unmerged
        description: "state = 'closed' AND merged_at IS NULL."
      - name: is_open
        description: "state = 'open' (open at run time)."
      - name: first_review_at
        description: "Earliest submitted review, excluding reviews by the PR author and by bots; NULL if never reviewed."
      - name: hours_to_first_review
        description: "Hours from created_at to first_review_at; NULL if never reviewed."
      - name: reviewed_within_7d
        description: "hours_to_first_review <= 168; false if never reviewed."
      - name: hours_to_merge
        description: "Hours from created_at to merged_at; NULL unless merged."
      - name: hours_to_close
        description: "Hours from created_at to closed_at, merged or not; NULL while open."
      - name: is_stale
        description: "Open AND updated_at more than 180 days before run time."
      - name: has_approving_review
        description: "Any non-author, non-bot review with state = 'APPROVED'."

  - name: fct_releases
    description: "One row per published release on or after the window start."
    columns:
      - name: repo
        description: "Repository as owner/name."
      - name: id
        description: "Release id."
      - name: release_key
        description: "Primary key: repo || '#' || id."
        data_tests:
          - unique
          - not_null
      - name: tag_name
        description: "Git tag of the release."
      - name: published_at
        description: "When the release was published, UTC."
      - name: is_prerelease
        description: "True for release candidates, betas, etc."
      - name: days_since_previous
        description: "Days since the repo's previous release. lag() runs before the window filter, so the first release in the window measures its gap to the release before it."

  - name: mart_repo_monthly
    description: "One row per repo per month, January 2024 through the run month, built on a generate_series month spine so empty months show 0. Each event is counted in the month it happened. Bot-authored PRs and commits are excluded."
    data_tests:
      - unique:
          column_name: "repo || '#' || month"
    columns:
      - name: repo
        description: "Repository as owner/name."
        data_tests:
          - not_null
      - name: month
        description: "First day of the month."
        data_tests:
          - not_null
      - name: month_index
        description: "Months since the window start (0 = January 2024); x-axis for trend slopes."
      - name: prs_opened
        description: "PRs opened this month (by created_at)."
      - name: prs_merged
        description: "PRs merged this month (by merged_at)."
      - name: prs_closed_unmerged
        description: "PRs closed without merging this month (by closed_at)."
      - name: merge_ratio
        description: "prs_merged / (prs_merged + prs_closed_unmerged); NULL when the denominator is 0."
      - name: median_first_review_hours
        description: "Median hours_to_first_review of PRs opened this month; unreviewed PRs are NULL and fall out."
      - name: median_merge_hours
        description: "Median hours_to_merge of PRs merged this month."
      - name: commits
        description: "Commits this month (by committed_at)."
      - name: active_contributors
        description: "Distinct non-bot PR authors who opened a PR this month."
      - name: is_partial_month
        description: "True for the run month, which is not complete yet."

  - name: mart_health_inputs
    description: "One row per repo, one column per health metric scored in Task 5. Every column is a rate, share, median, slope, or headcount, never a raw volume total. Bot-authored PRs and commits are excluded."
    columns:
      - name: repo
        description: "Repository as owner/name (primary key)."
        data_tests:
          - unique
          - not_null
      - name: commits_per_week
        description: "Activity. Commits in the window / (days in window / 7). Higher is healthier."
      - name: commit_trend_pct
        description: "Activity trend. regr_slope(commits, month_index) over complete months divided by the average monthly commits: relative change per month (0.01 = +1%/month). Higher is healthier."
      - name: median_hours_to_first_review
        description: "Responsiveness. Median hours from PR creation to first non-author, non-bot review, over reviewed PRs. Lower is healthier."
      - name: pct_reviewed_within_7d
        description: "Responsiveness. Share of PRs (created at least 7 days before run time) first reviewed within 7 days. Higher is healthier."
      - name: merge_rate
        description: "Throughput. Merged / (merged + closed unmerged) over PRs created in the window. Higher is healthier."
      - name: median_hours_to_merge
        description: "Throughput. Median hours from creation to merge, over merged PRs. Lower is healthier."
      - name: pct_open_stale
        description: "Backlog. Share of open PRs with no activity in 180+ days. Lower is healthier."
      - name: releases_per_year
        description: "Release cadence. Releases in the window / (days in window / 365.25). Higher is healthier."
      - name: bus_factor
        description: "Contributor base. Fewest PR authors who together account for at least 50% of merged PRs. Higher is healthier."
